<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<title>Chaukanna</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #f6f4ef; color: #33322d; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; text-align: center; }
  img { width: 88px; height: 88px; }
  h1 { margin: 0; font-size: 30px; line-height: 1.25; color: #191815; }
  p { margin: 0; max-width: 34rem; font-size: 21px; line-height: 1.5; }
  a { box-sizing: border-box; display: block; width: 100%; max-width: 22rem; padding: 18px; border-radius: 16px; background: #b91c1c; color: #fff; font-size: 34px; font-weight: 800; text-decoration: none; }
  button { min-height: 48px; padding: 10px 24px; border: 1px solid #a8a498; border-radius: 999px; background: transparent; color: inherit; font-size: 17px; }
  @media (prefers-color-scheme: dark) { html, body { background: #121311; color: #e7e5df; } h1 { color: #f6f4ef; } }
</style>
</head>
<body>
<main>
  <img src="/icon.svg" alt="">
  <h1 id="title">No internet</h1>
  <p id="advice">Chaukanna can't protect calls right now. If anyone asks for an OTP or money, hang up.</p>
  <a href="tel:1930">📞 1930</a>
  <button id="retry" onclick="location.reload()">Try again</button>
</main>
<script>
  var TEXT = {
    hi: ['इंटरनेट नहीं है', 'अभी चौकन्ना कॉल की सुरक्षा नहीं कर सकता। कोई OTP या पैसे माँगे, तो फ़ोन काट दीजिए।', 'फिर से कोशिश करें'],
    ta: ['இணையம் இல்லை', 'இப்போது சௌகன்னாவால் அழைப்புகளைப் பாதுகாக்க முடியாது. யாராவது OTP அல்லது பணம் கேட்டால், அழைப்பைத் துண்டியுங்கள்.', 'மீண்டும் முயலுங்கள்'],
    te: ['ఇంటర్నెట్ లేదు', 'ఇప్పుడు చౌకన్నా కాల్‌లను రక్షించలేదు. ఎవరైనా OTP లేదా డబ్బు అడిగితే, ఫోన్ పెట్టేయండి.', 'మళ్లీ ప్రయత్నించండి'],
    kn: ['ಇಂಟರ್ನೆಟ್ ಇಲ್ಲ', 'ಈಗ ಚೌಕನ್ನಾ ಕರೆಗಳನ್ನು ರಕ್ಷಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ. ಯಾರಾದರೂ OTP ಅಥವಾ ಹಣ ಕೇಳಿದರೆ, ಕರೆ ಕಡಿತಗೊಳಿಸಿ.', 'ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ'],
    ml: ['ഇന്റർനെറ്റ് ഇല്ല', 'ഇപ്പോൾ ചൗകന്നയ്ക്ക് കോളുകൾ സംരക്ഷിക്കാൻ കഴിയില്ല. ആരെങ്കിലും OTP അല്ലെങ്കിൽ പണം ചോദിച്ചാൽ, ഫോൺ കട്ട് ചെയ്യൂ.', 'വീണ്ടും ശ്രമിക്കൂ'],
    bn: ['ইন্টারনেট নেই', 'এখন চৌকান্না কল সুরক্ষিত রাখতে পারবে না। কেউ OTP বা টাকা চাইলে ফোন কেটে দিন।', 'আবার চেষ্টা করুন'],
    mr: ['इंटरनेट नाही', 'आत्ता चौकन्ना कॉलचे संरक्षण करू शकत नाही. कोणी OTP किंवा पैसे मागितले, तर फोन बंद करा.', 'पुन्हा प्रयत्न करा'],
    gu: ['ઇન્ટરનેટ નથી', 'અત્યારે ચૌકન્ના કૉલનું રક્ષણ કરી શકતું નથી. કોઈ OTP અથવા પૈસા માંગે, તો ફોન કાપી નાખો.', 'ફરી પ્રયાસ કરો'],
    pa: ['ਇੰਟਰਨੈੱਟ ਨਹੀਂ ਹੈ', 'ਹੁਣ ਚੌਕੰਨਾ ਕਾਲਾਂ ਦੀ ਸੁਰੱਖਿਆ ਨਹੀਂ ਕਰ ਸਕਦਾ। ਕੋਈ OTP ਜਾਂ ਪੈਸੇ ਮੰਗੇ, ਤਾਂ ਫ਼ੋਨ ਕੱਟੋ।', 'ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ']
  };
  var lang = 'en';
  try { lang = localStorage.getItem('chaukanna_lang') || (navigator.language || 'en').split('-')[0]; } catch (e) {}
  var text = TEXT[lang];
  if (text) {
    document.documentElement.lang = lang;
    document.getElementById('title').textContent = text[0];
    document.getElementById('advice').textContent = text[1];
    document.getElementById('retry').textContent = text[2];
  }
</script>
</body>
</html>
