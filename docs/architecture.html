<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Chaukanna Architecture</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B1020; }
  svg { display: block; font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .h1 { font-size: 34px; font-weight: 800; fill: #F8FAFC; }
  .sub { font-size: 16px; fill: #94A3B8; }
  .zl { font-size: 13px; font-weight: 800; letter-spacing: 1.6px; }
  .bt { font-size: 16px; font-weight: 700; fill: #F1F5F9; }
  .bs { font-size: 12.5px; fill: #94A3B8; }
  .bsb { font-size: 12.5px; fill: #CBD5E1; }
  .lbl { font-size: 11.5px; fill: #CBD5E1; font-weight: 600; }
  .box { fill: #131A2E; stroke-width: 1.5; }
  .badge circle { stroke: #0B1020; stroke-width: 2; }
  .badge text { font-size: 12px; font-weight: 800; fill: #0B1020; text-anchor: middle; dominant-baseline: central; }
  .chip text { font-size: 11.5px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .step { font-size: 13px; fill: #CBD5E1; }
  .stepn { font-size: 13px; font-weight: 800; }
</style>
</head>
<body>
<svg width="1800" height="1250" viewBox="0 0 1800 1250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38BDF8"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F59E0B"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34D399"/></marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1A2238"/></pattern>
  </defs>

  <rect width="1800" height="1250" fill="#0B1020"/>
  <rect width="1800" height="1250" fill="url(#grid)"/>

  <!-- ===== Title ===== -->
  <text x="40" y="72" class="h1">🛡️ Chaukanna — System Architecture</text>
  <text x="40" y="104" class="sub">Real-time scam-call guardian  ·  Go + React / Tailwind  ·  Gnani AI Prisma · Timbre  ·  any OpenAI-compatible reasoning model (Evon when available)</text>

  <!-- Legend -->
  <g transform="translate(1290,56)">
    <line x1="0" y1="8" x2="34" y2="8" stroke="#38BDF8" stroke-width="2.5"/><text x="42" y="12" class="bs">audio / transcript</text>
    <line x1="200" y1="8" x2="234" y2="8" stroke="#A78BFA" stroke-width="2.5"/><text x="242" y="12" class="bs">reasoning</text>
    <line x1="0" y1="38" x2="34" y2="38" stroke="#F59E0B" stroke-width="2.5"/><text x="42" y="42" class="bs">warning &amp; alert path</text>
    <line x1="200" y1="38" x2="234" y2="38" stroke="#34D399" stroke-width="2.5"/><text x="242" y="42" class="bs">dashboard</text>
  </g>

  <!-- ===== Zones ===== -->
  <rect x="40" y="140" width="300" height="890" rx="18" fill="#38BDF8" fill-opacity="0.05" stroke="#38BDF8" stroke-opacity="0.35" stroke-dasharray="6 6"/>
  <text x="60" y="172" class="zl" fill="#38BDF8">📞 TELEPHONY</text>

  <rect x="380" y="140" width="760" height="890" rx="18" fill="#00ADD8" fill-opacity="0.05" stroke="#00ADD8" stroke-opacity="0.45" stroke-dasharray="6 6"/>
  <text x="400" y="172" class="zl" fill="#22D3EE">⚙️ GO BACKEND  ·  SINGLE BINARY  ·  GOROUTINE PER CALL</text>

  <rect x="1180" y="140" width="300" height="890" rx="18" fill="#A78BFA" fill-opacity="0.07" stroke="#A78BFA" stroke-opacity="0.5" stroke-dasharray="6 6"/>
  <text x="1200" y="172" class="zl" fill="#C4B5FD">🧠 GNANI AI MODELS</text>

  <rect x="1520" y="140" width="240" height="890" rx="18" fill="#34D399" fill-opacity="0.05" stroke="#34D399" stroke-opacity="0.4" stroke-dasharray="6 6"/>
  <text x="1540" y="172" class="zl" fill="#34D399">👥 CLIENTS</text>

  <!-- ===== Connectors (drawn under boxes) ===== -->
  <!-- user <-> scammer call -->
  <line x1="190" y1="553" x2="190" y2="677" stroke="#94A3B8" stroke-width="2" marker-start="url(#a-gray)" marker-end="url(#a-gray)"/>
  <text x="204" y="620" class="lbl">regular phone call</text>
  <!-- user <-> exotel merged leg -->
  <line x1="190" y1="447" x2="190" y2="353" stroke="#38BDF8" stroke-width="2.2" marker-start="url(#a-amber)" marker-end="url(#a-cyan)"/>
  <text x="204" y="404" class="lbl">merged conference leg</text>

  <!-- exotel <-> media -->
  <line x1="320" y1="280" x2="402" y2="280" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#a-cyan)"/>
  <line x1="405" y1="318" x2="323" y2="318" stroke="#F59E0B" stroke-width="2.2" marker-end="url(#a-amber)"/>
  <text x="362" y="270" class="lbl" text-anchor="middle">WS · 8 kHz</text>

  <!-- media -> prisma -->
  <polyline points="510,240 510,210 1202,210" fill="none" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#a-cyan)"/>
  <text x="740" y="203" class="lbl">audio frames · streaming</text>

  <!-- prisma -> session -->
  <line x1="1205" y1="315" x2="1098" y2="315" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#a-cyan)"/>
  <text x="1150" y="292" class="lbl" text-anchor="middle">transcripts</text>

  <!-- session -> prefilter, session -> hub -->
  <line x1="750" y1="350" x2="750" y2="397" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#a-cyan)"/>
  <line x1="990" y1="350" x2="990" y2="397" stroke="#34D399" stroke-width="2.2" marker-end="url(#a-green)"/>

  <!-- prefilter -> orch -->
  <line x1="750" y1="490" x2="750" y2="557" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#a-cyan)"/>
  <text x="732" y="529" class="lbl" text-anchor="end">spike · every 5 s</text>

  <!-- orch <-> session (window down / risk up) -->
  <line x1="870" y1="557" x2="870" y2="353" stroke="#A78BFA" stroke-width="2" marker-start="url(#a-purple)" marker-end="url(#a-purple)"/>

  <!-- orch <-> evon -->
  <line x1="1095" y1="595" x2="1202" y2="595" stroke="#A78BFA" stroke-width="2.2" marker-end="url(#a-purple)"/>
  <line x1="1205" y1="645" x2="1098" y2="645" stroke="#A78BFA" stroke-width="2.2" marker-end="url(#a-purple)"/>
  <text x="1150" y="587" class="lbl" text-anchor="middle">prompt</text>
  <text x="1150" y="666" class="lbl" text-anchor="middle">JSON</text>

  <!-- orch -> timbre -->
  <polyline points="750,670 750,930 1202,930" fill="none" stroke="#F59E0B" stroke-width="2.2" marker-end="url(#a-amber)"/>
  <text x="800" y="920" class="lbl">risk ≥ 0.8  →  checked warning + language</text>

  <!-- timbre -> media -->
  <polyline points="1205,975 420,975 420,353" fill="none" stroke="#F59E0B" stroke-width="2.2" marker-end="url(#a-amber)"/>
  <text x="640" y="967" class="lbl">warning audio (resampled to 8 kHz) injected into live call</text>

  <!-- orch -> alert -> family -->
  <line x1="990" y1="670" x2="990" y2="777" stroke="#F59E0B" stroke-width="2.2" marker-end="url(#a-amber)"/>
  <line x1="1095" y1="825" x2="1537" y2="825" stroke="#F59E0B" stroke-width="2.2" marker-end="url(#a-amber)"/>
  <text x="1320" y="803" class="lbl" text-anchor="middle">Telegram alert</text>

  <!-- hub -> dashboard -->
  <line x1="1095" y1="440" x2="1537" y2="440" stroke="#34D399" stroke-width="2.2" marker-end="url(#a-green)"/>
  <text x="1320" y="418" class="lbl" text-anchor="middle">live transcript + red flags</text>

  <!-- family -.-> dashboard -->
  <line x1="1640" y1="775" x2="1640" y2="503" stroke="#34D399" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a-green)"/>
  <text x="1652" y="645" class="lbl">opens link</text>

  <!-- ===== Telephony boxes ===== -->
  <rect x="60" y="240" width="260" height="110" rx="12" class="box" stroke="#38BDF8"/>
  <text x="190" y="278" class="bt" text-anchor="middle">☎️ Exotel / Twilio</text>
  <text x="190" y="300" class="bs" text-anchor="middle">virtual Chaukanna number</text>
  <text x="190" y="320" class="bs" text-anchor="middle">bidirectional media stream</text>

  <rect x="60" y="450" width="260" height="100" rx="12" class="box" stroke="#38BDF8"/>
  <text x="190" y="486" class="bt" text-anchor="middle">👵 User's phone</text>
  <text x="190" y="508" class="bs" text-anchor="middle">Add call → Chaukanna → Merge</text>
  <text x="190" y="528" class="bs" text-anchor="middle">hears warning on the call</text>

  <rect x="60" y="680" width="260" height="100" rx="12" class="box" stroke="#EF4444"/>
  <text x="190" y="716" class="bt" text-anchor="middle">☠️ Scam caller</text>
  <text x="190" y="738" class="bs" text-anchor="middle">"Main CBI se bol raha hoon…"</text>
  <text x="190" y="758" class="bs" text-anchor="middle">also hears the warning</text>

  <rect x="60" y="830" width="260" height="180" rx="12" fill="#38BDF8" fill-opacity="0.07" stroke="#38BDF8" stroke-opacity="0.3"/>
  <text x="80" y="862" class="bt" style="font-size:14px">No app needed</text>
  <text x="80" y="890" class="bsb">✓ No app or OS permissions</text>
  <text x="80" y="914" class="bsb">✓ Standard 3-way conference</text>
  <text x="80" y="938" class="bsb">✓ Or: Speakerphone, no number</text>
  <text x="80" y="962" class="bsb">✓ Screen Mode: forward</text>
  <text x="80" y="982" class="bsb">   unanswered unknown calls</text>

  <!-- ===== Go boxes ===== -->
  <rect x="405" y="240" width="210" height="110" rx="12" class="box" stroke="#00ADD8"/>
  <text x="510" y="276" class="bt" text-anchor="middle">Media Stream Handler</text>
  <text x="510" y="298" class="bs" text-anchor="middle">WebSocket · μ-law / PCM</text>
  <text x="510" y="318" class="bs" text-anchor="middle">1 goroutine per call</text>

  <rect x="645" y="240" width="450" height="110" rx="12" class="box" stroke="#00ADD8"/>
  <text x="665" y="270" class="bt">Call Session</text>
  <text x="772" y="270" class="bs">rolling transcript · risk state machine · 💾 SQLite</text>
  <g class="chip">
    <rect x="660" y="298" width="90" height="30" rx="15" fill="#22C55E" fill-opacity="0.15" stroke="#22C55E"/><text x="705" y="313" fill="#4ADE80">Listening</text>
    <rect x="770" y="298" width="90" height="30" rx="15" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B"/><text x="815" y="313" fill="#FBBF24">Suspicious</text>
    <rect x="880" y="298" width="90" height="30" rx="15" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444"/><text x="925" y="313" fill="#F87171">Scam</text>
    <rect x="990" y="298" width="90" height="30" rx="15" fill="#A78BFA" fill-opacity="0.15" stroke="#A78BFA"/><text x="1035" y="313" fill="#C4B5FD">Warned</text>
  </g>
  <text x="760" y="317" class="bs" text-anchor="middle">›</text>
  <text x="870" y="317" class="bs" text-anchor="middle">›</text>
  <text x="980" y="317" class="bs" text-anchor="middle">›</text>

  <rect x="645" y="400" width="210" height="90" rx="12" class="box" stroke="#00ADD8"/>
  <text x="750" y="434" class="bt" text-anchor="middle">⚡ Fast Pre-filter</text>
  <text x="750" y="456" class="bs" text-anchor="middle">Indic keyword + regex rules</text>
  <text x="750" y="474" class="bs" text-anchor="middle">runs on every transcript · &lt;5 ms</text>

  <rect x="885" y="400" width="210" height="90" rx="12" class="box" stroke="#00ADD8"/>
  <text x="990" y="434" class="bt" text-anchor="middle">📡 Dashboard Hub</text>
  <text x="990" y="456" class="bs" text-anchor="middle">WebSocket fan-out</text>
  <text x="990" y="474" class="bs" text-anchor="middle">to family browsers</text>

  <rect x="645" y="560" width="450" height="110" rx="12" class="box" stroke="#A78BFA" stroke-width="2"/>
  <text x="665" y="592" class="bt">🎯 Reasoning Orchestrator</text>
  <text x="665" y="616" class="bsb">• Calls the LLM every ~5 s, or at once on a pre-filter spike</text>
  <text x="665" y="636" class="bsb">• 60 s rolling window + summary of earlier flags</text>
  <text x="665" y="656" class="bsb">• Direct demand → Scam · person complying → "stop!"</text>

  <rect x="885" y="780" width="210" height="90" rx="12" class="box" stroke="#F59E0B"/>
  <text x="990" y="814" class="bt" text-anchor="middle">🚨 Alert Service</text>
  <text x="990" y="836" class="bs" text-anchor="middle">Telegram · WhatsApp · SMS</text>
  <text x="990" y="854" class="bs" text-anchor="middle">caution · warning · urgent</text>

  <!-- latency card -->
  <rect x="440" y="420" width="175" height="250" rx="12" fill="#00ADD8" fill-opacity="0.07" stroke="#00ADD8" stroke-opacity="0.3"/>
  <text x="456" y="450" class="bt" style="font-size:14px">⏱ Latency targets</text>
  <text x="456" y="480" class="bs">STT per line</text><text x="600" y="480" class="bsb" text-anchor="end">~1 s</text>
  <text x="456" y="506" class="bs">Pre-filter</text><text x="600" y="506" class="bsb" text-anchor="end">&lt;5 ms</text>
  <text x="456" y="532" class="bs">LLM window</text><text x="600" y="532" class="bsb" text-anchor="end">1–2 s</text>
  <text x="456" y="558" class="bs">Timbre TTS</text><text x="600" y="558" class="bsb" text-anchor="end">cached</text>
  <line x1="456" y1="578" x2="600" y2="578" stroke="#334155"/>
  <text x="456" y="602" class="bs">Scam phrase →</text>
  <text x="456" y="622" class="bs">warning on call</text>
  <text x="600" y="652" text-anchor="end" style="font-size:22px;font-weight:800;fill:#FBBF24">&lt; 3 s</text>

  <!-- go stack card -->
  <rect x="440" y="700" width="175" height="170" rx="12" fill="#00ADD8" fill-opacity="0.07" stroke="#00ADD8" stroke-opacity="0.3"/>
  <text x="456" y="730" class="bt" style="font-size:14px">🐹 Go stack</text>
  <text x="456" y="756" class="bsb">Gin router · GORM</text>
  <text x="456" y="778" class="bsb">gorilla/websocket</text>
  <text x="456" y="800" class="bsb">AES-GCM at rest</text>
  <text x="456" y="822" class="bsb">login + rate limits</text>
  <text x="456" y="844" class="bsb">isolated public demo</text>

  <!-- ===== Gnani boxes ===== -->
  <rect x="1205" y="190" width="250" height="150" rx="12" class="box" stroke="#A78BFA" stroke-width="2"/>
  <text x="1330" y="226" class="bt" text-anchor="middle" style="font-size:18px">🎙️ Prisma</text>
  <text x="1330" y="250" class="bsb" text-anchor="middle">Streaming speech-to-text</text>
  <text x="1330" y="272" class="bs" text-anchor="middle">Hindi · Hinglish · regional</text>
  <text x="1330" y="292" class="bs" text-anchor="middle">noisy 8 kHz telephony audio</text>
  <text x="1330" y="318" class="bs" text-anchor="middle">keyterms · final transcripts</text>

  <rect x="1205" y="520" width="250" height="180" rx="12" class="box" stroke="#A78BFA" stroke-width="2"/>
  <text x="1330" y="556" class="bt" text-anchor="middle" style="font-size:18px">🧠 Reasoning LLM</text>
  <text x="1330" y="580" class="bsb" text-anchor="middle">Evon, or a stand-in today</text>
  <text x="1330" y="602" class="bs" text-anchor="middle">rules still work without it</text>
  <text x="1330" y="622" class="bs" text-anchor="middle">(OpenAI-compatible API)</text>
  <text x="1330" y="650" class="bsb" text-anchor="middle">→ { risk, flags, reason,</text>
  <text x="1330" y="670" class="bsb" text-anchor="middle">language }</text>

  <rect x="1205" y="900" width="250" height="100" rx="12" class="box" stroke="#A78BFA" stroke-width="2"/>
  <text x="1330" y="934" class="bt" text-anchor="middle" style="font-size:18px">🔊 Timbre</text>
  <text x="1330" y="958" class="bsb" text-anchor="middle">Text-to-speech</text>
  <text x="1330" y="980" class="bs" text-anchor="middle">10 languages · family voice</text>

  <!-- ===== Client boxes ===== -->
  <rect x="1540" y="380" width="200" height="120" rx="12" class="box" stroke="#34D399"/>
  <text x="1640" y="414" class="bt" text-anchor="middle">🖥️ Family Dashboard</text>
  <text x="1640" y="436" class="bsb" text-anchor="middle">React + Vite + Tailwind</text>
  <text x="1640" y="458" class="bs" text-anchor="middle">live transcript · Step In</text>
  <text x="1640" y="478" class="bs" text-anchor="middle">red-flag timeline · risk gauge</text>

  <rect x="1540" y="775" width="200" height="100" rx="12" class="box" stroke="#F59E0B"/>
  <text x="1640" y="810" class="bt" text-anchor="middle">👨‍👩‍👧 Family member</text>
  <text x="1640" y="832" class="bs" text-anchor="middle">instant Telegram alert</text>
  <text x="1640" y="852" class="bs" text-anchor="middle">warn · speak · mark safe</text>

  <!-- ===== Step badges ===== -->
  <g class="badge">
    <circle cx="176" cy="400" r="12" fill="#38BDF8"/><text x="176" y="400">1</text>
    <circle cx="362" cy="299" r="12" fill="#38BDF8"/><text x="362" y="299">2</text>
    <circle cx="715" cy="210" r="12" fill="#38BDF8"/><text x="715" y="210">3</text>
    <circle cx="1150" cy="315" r="12" fill="#38BDF8"/><text x="1150" y="315">4</text>
    <circle cx="750" cy="375" r="12" fill="#38BDF8"/><text x="750" y="375">5</text>
    <circle cx="750" cy="525" r="12" fill="#38BDF8"/><text x="750" y="525">6</text>
    <circle cx="1150" cy="620" r="12" fill="#A78BFA"/><text x="1150" y="620">7</text>
    <circle cx="775" cy="930" r="12" fill="#F59E0B"/><text x="775" y="930">8</text>
    <circle cx="420" cy="935" r="12" fill="#F59E0B"/><text x="420" y="935">9</text>
    <circle cx="1320" cy="825" r="12" fill="#F59E0B"/><text x="1320" y="825">10</text>
    <circle cx="1320" cy="440" r="12" fill="#34D399"/><text x="1320" y="440">11</text>
  </g>

  <!-- ===== Footer: step legend ===== -->
  <rect x="40" y="1060" width="1720" height="160" rx="16" fill="#131A2E" stroke="#1E293B"/>
  <g>
    <text x="70" y="1098" class="stepn" fill="#38BDF8">1</text><text x="92" y="1098" class="step">User merges the suspicious call with the Chaukanna number</text>
    <text x="70" y="1128" class="stepn" fill="#38BDF8">2</text><text x="92" y="1128" class="step">Telephony provider opens a bidirectional 8 kHz WebSocket</text>
    <text x="70" y="1158" class="stepn" fill="#38BDF8">3</text><text x="92" y="1158" class="step">Audio frames stream to Gnani Prisma, reconnecting if a session ends</text>
    <text x="70" y="1188" class="stepn" fill="#38BDF8">4</text><text x="92" y="1188" class="step">Live Hindi / Hinglish / regional transcripts return</text>

    <text x="640" y="1098" class="stepn" fill="#38BDF8">5</text><text x="662" y="1098" class="step">Every transcript is checked by the fast pre-filter</text>
    <text x="640" y="1128" class="stepn" fill="#38BDF8">6</text><text x="662" y="1128" class="step">A direct demand warns at once; a model can add judgement</text>
    <text x="640" y="1158" class="stepn" fill="#A78BFA">7</text><text x="662" y="1158" class="step">The LLM reasons over a scam playbook and returns JSON with red flags</text>
    <text x="640" y="1188" class="stepn" fill="#F59E0B">8</text><text x="662" y="1188" class="step">Risk ≥ 0.8: Timbre speaks a pre-written warning in the user's language</text>

    <text x="1230" y="1098" class="stepn" fill="#F59E0B">9</text><text x="1252" y="1098" class="step">Warning plays on the call; talk-outs and read-outs get a reply</text>
    <text x="1230" y="1128" class="stepn" fill="#F59E0B">10</text><text x="1258" y="1128" class="step">Family is alerted, and again if the warning is being ignored</text>
    <text x="1230" y="1158" class="stepn" fill="#34D399">11</text><text x="1258" y="1158" class="step">Dashboard streams the call, and the family can step in</text>
    <text x="1230" y="1196" style="font-size:12px;fill:#64748B">#GnaniAI  #GreatIndianAIInternshipChallenge</text>
  </g>
</svg>
</body>
</html>
